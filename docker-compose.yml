version: '3.8'

services:
  db:
    image: postgres:16
    container_name: flashmind-db
    environment:
      POSTGRES_DB: flashmind
      POSTGRES_USER: flash
      POSTGRES_PASSWORD: flash
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flash -d flashmind"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flashmind-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: flashmind-backend
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.docker
      - DEBUG=True
      - SECRET_KEY=dev-secret-key-change-in-production
      - DATABASE_NAME=flashmind
      - DATABASE_USER=flash
      - DATABASE_PASSWORD=flash
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  celery:
    build: ./backend
    container_name: flashmind-celery
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.docker
      - DEBUG=True
      - SECRET_KEY=dev-secret-key-change-in-production
      - DATABASE_NAME=flashmind
      - DATABASE_USER=flash
      - DATABASE_PASSWORD=flash
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A core worker -l info

volumes:
  postgres_data:
