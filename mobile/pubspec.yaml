name: flashmind_mobile
description: FlashMind - App de estudos com repetição espaçada
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP e API
  dio: ^5.4.0
  
  # Local database
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  
  # State management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  
  # Local storage (tokens)
  shared_preferences: ^2.2.0
  
  # Sync e offline
  connectivity_plus: ^5.0.0
  
  # UI
  flutter_animate: ^4.2.0
  google_fonts: ^6.1.0
  
  # Navigation
  go_router: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - .env
